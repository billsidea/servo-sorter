[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[project]
name = "servo_sorter"
version = "0.0.1"
dependencies = [
    "adafruit-circuitpython-servokit>=1.3.24",
]
authors = [
  { name="William Blaney", email="billsidea@gmail.com" },
]
description = "A utility that uses commonly available, low-cost RC/hobbyist servos to provide a tiered sorting function"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/billsidea/servo-sorter"
Issues = "https://github.com/billsidea/servo-sorter/issues"